course:
  id: math-modeling-it
  audience: adjuncts
  language: uk
  computational_environment: Python
  development_status: content_complete
  qa_status: automated_ci_enabled
  presentation_status: initial_pptx_pack_generated
  principle: "прикладна задача -> математична модель -> модель у Python -> експеримент -> візуалізація -> інтерпретація -> науковий висновок"

stack:
  core:
    - python
    - numpy
    - pandas
    - scipy
    - matplotlib
    - sympy
    - networkx
  optimization:
    - pulp
    - ortools
  workflow:
    - jupyter
    - vscode
    - git
    - github

lessons:
  - id: t1_l1
    topic: 1
    lesson: 1
    title: "Форма і принципи представлення математичних моделей"
    python_focus: [numpy, matplotlib, functions]
    practical_result: "Параметрична модель y=f(x, parameters) та серія обчислювальних експериментів"
    status: content_stable

  - id: t1_l2
    topic: 1
    lesson: 2
    title: "Класифікація математичних моделей"
    python_focus: [numpy, random, matplotlib, monte_carlo, pytest]
    practical_result: "Один об’єкт у детермінованій, стохастичній, дискретній динамічній та Monte Carlo моделях; порівняння, відтворюваність та сценарний аналіз"
    status: content_stable

  - id: t1_l3
    topic: 1
    lesson: 3
    title: "Організація математичного моделювання"
    python_focus: [python, numpy, pandas, jupyter, json_config, metadata, hashing, pytest, git]
    practical_result: "Дослідницьке питання -> дані/конфігурація -> модель -> відтворюваний експеримент -> перевірка -> результати/метадані -> простежуваність у Git"
    status: content_stable

  - id: t1_l4
    topic: 1
    lesson: 4
    title: "Класифікація методів математичного моделювання"
    python_focus: [scipy.optimize, sympy, numpy, pandas, networkx, monte_carlo, mcda, pytest]
    practical_result: "Лабораторія вибору методу: структура задачі -> метод -> інструмент Python -> перевірка -> інтерпретація"
    status: content_stable

  - id: t2_l1
    topic: 2
    lesson: 1
    title: "Задачі оптимізації в середовищі VS Code"
    python_focus: [numpy, scipy.optimize, pandas, matplotlib, pytest]
    practical_result: "Оптимальний розподіл обмежених ресурсів, verification та sensitivity analysis"
    status: content_stable

  - id: t2_l2
    topic: 2
    lesson: 2
    title: "Математична модель транспортної задачі"
    python_focus: [pandas, numpy, pulp, scipy.optimize, matplotlib, pytest]
    practical_result: "CSV -> транспортна модель лінійного програмування -> оптимальні потоки -> незалежна перевірка -> сценарний аналіз -> візуалізація"
    status: content_stable

  - id: t2_l3
    topic: 2
    lesson: 3
    title: "Математичні моделі задач нелінійного програмування"
    python_focus: [numpy, scipy.optimize, slsqp, multistart, grid_search, pandas, matplotlib, pytest]
    practical_result: "Нелінійний розподіл ресурсу зі спадною граничною віддачею -> SLSQP -> перевірки допустимості -> аналіз чутливості; неопукла задача -> багатостартовий пошук -> перевірка пошуком по сітці -> контурна візуалізація"
    status: content_stable

  - id: t2_l4
    topic: 2
    lesson: 4
    title: "Математичне моделювання із застосуванням методів мережевого планування"
    python_focus: [networkx, pandas, numpy, cpm, pert, beta_pert, monte_carlo, matplotlib, pytest]
    practical_result: "DAG -> CPM schedule -> critical path/slack -> delay scenarios -> PERT -> Monte Carlo project duration -> deadline probability and critical-path frequency"
    status: content_stable

  - id: t2_l5
    topic: 2
    lesson: 5
    title: "Засоби розв’язування задач множинного вибору"
    python_focus: [numpy, pandas, matplotlib, wsm, topsis, mcda, sensitivity_analysis, dirichlet_robustness, pytest]
    practical_result: "Decision matrix -> benefit/cost criteria -> normalization -> WSM/TOPSIS -> ranking comparison -> one-factor weight sensitivity -> stochastic robustness of top choice"
    status: content_stable

  - id: t2_l6
    topic: 2
    lesson: 6
    title: "Системи комп'ютерної математики та їх можливості для математичного моделювання"
    python_focus: [sympy, symbolic_algebra, differentiation, integration, lambdify, numpy, scipy.integrate, solve_ivp, matplotlib, pytest]
    practical_result: "Символьна модель ОДР -> рівновага/аналітичний розв’язок -> диференціювання/інтегрування -> символьна перевірка нев’язки -> lambdify -> незалежна чисельна перевірка SciPy solve_ivp -> експеримент чутливості"
    status: content_stable

  - id: t2_l7
    topic: 2
    lesson: 7
    title: "Використання систем комп’ютерної математики в наукових дослідженнях"
    python_focus: [numpy, pandas, scipy.optimize, least_squares, scipy.integrate, solve_ivp, bootstrap, sensitivity_analysis, matplotlib, jupyter, metadata, hashing, pytest, git]
    practical_result: "Research question -> hypothesis -> synthetic observations -> parameter calibration -> analytical prediction -> independent numerical verification -> batch scenarios -> bootstrap uncertainty -> sensitivity -> figures/tables/metadata -> reproducible scientific conclusion"
    status: content_stable

capstone:
  path: capstone
  status: content_stable
  practical_result: "Інтегрований мініпроєкт дослідження: калібрування -> оптимізація з обмеженнями -> незалежна перевірка -> чутливість -> бутстреп-оцінювання невизначеності -> метадані відтворюваності -> науковий висновок"

