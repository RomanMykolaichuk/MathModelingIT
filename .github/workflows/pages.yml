name: Deploy MathModelingIT Lab

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "books/**"
      - "tools/build_minibooks.py"
      - "tools/generate_lab_pdfs.py"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PDF lab instructions
        run: |
          python -m pip install --upgrade pip
          pip install reportlab==4.4.9 Markdown==3.9
          python tools/generate_lab_pdfs.py
          python tools/build_minibooks.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
