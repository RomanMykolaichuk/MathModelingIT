name: Course CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate web lab
        run: |
          python tools/generate_lab_pdfs.py
          python tools/build_minibooks.py
          python tools/verify_minibook_math.py
          test -s web/index.html
          test -s web/styles.css
          test -s web/course-catalog.js
          test -s web/lab-engine.js
          test -s web/app.js
          test -s web/control-cases.json
          test -s web/instructions/t1_l1_lab_instruction.pdf
          test -s web/instructions/t2_l4_lab_instruction.pdf
          test -s web/instructions/t2_l5_lab_instruction.pdf
          grep -q 'Конспект ↗' web/index.html
          grep -q 'Теорія · MiniBook ↗' web/index.html
          test -s books/t1_l1/book.md
          test -s books/t1_l1/metadata.yaml
          test -s web/books/t1_l1/index.html
          test -s web/books/t1_l1/figures/fig_03_baseline_scenario.svg
          test -s books/t2_l1/book.md
          test -s books/t2_l1/metadata.yaml
          test -s web/books/t2_l1/index.html
          test -s web/books/t2_l1/figures/fig_08_model_limits.svg
          test -s books/t2_l2/book.md
          test -s books/t2_l2/metadata.yaml
          test -s web/books/t2_l2/index.html
          test -s web/books/t2_l2/figures/fig_08_model_limits.svg
          test -s books/t2_l3/book.md
          test -s books/t2_l3/metadata.yaml
          test -s web/books/t2_l3/index.html
          test -s web/books/t2_l3/figures/fig_08_verification_layers.svg
          grep -q 'books/t2_l1/index.html' web/course-catalog.js
          grep -q 'books/t2_l2/index.html' web/course-catalog.js
          grep -q 'books/t2_l3/index.html' web/course-catalog.js
          test -s books/t2_l4/book.md
          test -s books/t2_l4/metadata.yaml
          test -s web/books/t2_l4/index.html
          test -s web/books/t2_l4/figures/fig_02_baseline_network.svg
          test -s books/t2_l5/book.md
          test -s books/t2_l5/metadata.yaml
          test -s web/books/t2_l5/index.html
          test -s web/books/t2_l5/figures/fig_06_robustness.svg
          grep -q 'books/t2_l4/index.html' web/index.html
          grep -q 'books/t2_l5/index.html' web/index.html
          grep -q 'instructions/t1_l1_lab_instruction.pdf' web/index.html
          grep -q 'instructions/t2_l4_lab_instruction.pdf' web/index.html
          grep -q 'instructions/t2_l5_lab_instruction.pdf' web/index.html
          node --check web/course-catalog.js
          node --check web/lab-engine.js
          node --check web/app.js
          node web/control-cases.test.js
          python tools/verify_web_control_cases.py

      - name: Run full course smoke check
        env:
          MPLBACKEND: Agg
        run: python tools/course_smoke.py --timeout 180

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-smoke-report
          path: course_smoke_report.json
