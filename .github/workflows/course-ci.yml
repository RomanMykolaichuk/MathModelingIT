name: Course CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full course smoke check
        env:
          MPLBACKEND: Agg
        run: python tools/course_smoke.py --timeout 180

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-smoke-report
          path: course_smoke_report.json
