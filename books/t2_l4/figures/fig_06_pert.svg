<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420"><rect width="960" height="420" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="480" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">PERT: три оцінки замість однієї</text><line x1="120" y1="280" x2="840" y2="280" stroke="#9fb3c8" stroke-width="3"/><circle cx="240" cy="280" r="10" fill="#70b7ff"/><circle cx="480" cy="280" r="12" fill="#f2c94c"/><circle cx="720" cy="280" r="10" fill="#70b7ff"/><path d="M240 280 C340 90,620 90,720 280" fill="none" stroke="#70b7ff" stroke-width="4"/><g text-anchor="middle"><text x="240" y="325" fill="#edf4fb" font-size="16">a</text><text x="240" y="348" fill="#9fb3c8" font-size="13">optimistic</text><text x="480" y="325" fill="#edf4fb" font-size="16">m</text><text x="480" y="348" fill="#9fb3c8" font-size="13">most likely</text><text x="720" y="325" fill="#edf4fb" font-size="16">b</text><text x="720" y="348" fill="#9fb3c8" font-size="13">pessimistic</text><text x="480" y="120" fill="#edf4fb" font-size="19">E(T) = (a + 4m + b) / 6</text></g></g></svg>