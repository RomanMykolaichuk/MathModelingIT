<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Однакова затримка +3 — різний системний ефект</text><rect x="70" y="95" width="390" height="250" rx="20" fill="#14283e" stroke="#2a435b"/><rect x="540" y="95" width="390" height="250" rx="20" fill="#14283e" stroke="#2a435b"/><text x="265" y="135" text-anchor="middle" fill="#70b7ff" font-size="19" font-weight="700">C +3</text><text x="735" y="135" text-anchor="middle" fill="#70b7ff" font-size="19" font-weight="700">D +3</text><text x="265" y="190" text-anchor="middle" fill="#edf4fb" font-size="17">C критична</text><text x="265" y="225" text-anchor="middle" fill="#edf4fb" font-size="17">slack = 0</text><text x="265" y="275" text-anchor="middle" fill="#f2c94c" font-size="28" font-weight="700">17 → 20</text><text x="735" y="190" text-anchor="middle" fill="#edf4fb" font-size="17">D некритична</text><text x="735" y="225" text-anchor="middle" fill="#edf4fb" font-size="17">slack = 4</text><text x="735" y="275" text-anchor="middle" fill="#7ee0a3" font-size="28" font-weight="700">17 → 17</text><text x="500" y="390" text-anchor="middle" fill="#9fb3c8" font-size="16">Ефект визначає не лише величина затримки, а місце роботи в мережі та доступний резерв.</text></g></svg>