<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410"><rect width="1100" height="410" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="550" y="40" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Forward pass: ранні строки</text><g fill="#14283e" stroke="#2a435b"><rect x="55" y="100" width="160" height="150" rx="16"/><rect x="255" y="100" width="160" height="150" rx="16"/><rect x="455" y="100" width="160" height="150" rx="16"/><rect x="655" y="100" width="160" height="150" rx="16"/><rect x="855" y="100" width="190" height="150" rx="16"/></g><g fill="#70b7ff" text-anchor="middle" font-size="16" font-weight="700"><text x="135" y="132">A</text><text x="335" y="132">C</text><text x="535" y="132">E</text><text x="735" y="132">G</text><text x="950" y="132">Project</text></g><g fill="#edf4fb" text-anchor="middle" font-size="15"><text x="135" y="170">ES=0</text><text x="135" y="200">EF=4</text><text x="335" y="170">ES=4</text><text x="335" y="200">EF=9</text><text x="535" y="170">ES=max(3,9)=9</text><text x="535" y="200">EF=15</text><text x="735" y="170">ES=max(15,11)=15</text><text x="735" y="200">EF=17</text><text x="950" y="180">T = 17</text></g><g stroke="#f2c94c" stroke-width="3"><line x1="215" y1="175" x2="250" y2="175"/><line x1="415" y1="175" x2="450" y2="175"/><line x1="615" y1="175" x2="650" y2="175"/><line x1="815" y1="175" x2="850" y2="175"/></g><text x="550" y="325" text-anchor="middle" fill="#9fb3c8" font-size="17">Для роботи з кількома predecessors: ES = max(EF попередників)</text></g></svg>