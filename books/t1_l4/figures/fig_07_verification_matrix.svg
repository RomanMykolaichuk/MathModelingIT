<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Метод визначає спосіб перевірки</text><g font-size="15"><text x="110" y="105" fill="#f2c94c" font-weight="700">Метод</text><text x="520" y="105" fill="#f2c94c" font-weight="700">Перевірка</text><text x="110" y="155" fill="#eaf2f8">Пошук кореня</text><text x="520" y="155" fill="#9fb3c8">нев’язка |f(t*)|</text><text x="110" y="205" fill="#eaf2f8">Символьний</text><text x="520" y="205" fill="#9fb3c8">підстановка / спрощення</text><text x="110" y="255" fill="#eaf2f8">Оптимізація</text><text x="520" y="255" fill="#9fb3c8">допустимість + цільова функція</text><text x="110" y="305" fill="#eaf2f8">Monte Carlo</text><text x="520" y="305" fill="#9fb3c8">seed + збіжність + діапазон</text><text x="110" y="355" fill="#eaf2f8">Мережа</text><text x="520" y="355" fill="#9fb3c8">валідність шляху + довжина</text><text x="110" y="405" fill="#eaf2f8">MCDA</text><text x="520" y="405" fill="#9fb3c8">напрями + ваги + перерахунок</text></g><line x1="90" y1="120" x2="910" y2="120" stroke="#35506b"/><line x1="450" y1="80" x2="450" y2="430" stroke="#35506b"/></g></svg>