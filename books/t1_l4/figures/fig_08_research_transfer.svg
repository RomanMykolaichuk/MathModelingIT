<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Перенесення методу у дисертаційне дослідження</text><rect x="55" y="160" width="190" height="90" rx="16" fill="#12283d" stroke="#70b7ff" stroke-width="2"/><text x="150" y="211" text-anchor="middle" fill="#eaf2f8" font-size="18" font-weight="700">Дослідницьке питання</text><line x1="245" y1="205" x2="300" y2="205" stroke="#f2c94c" stroke-width="4"/><path d="M 288 197 L 300 205 L 288 213" fill="none" stroke="#f2c94c" stroke-width="4"/><rect x="300" y="160" width="160" height="90" rx="16" fill="#12283d" stroke="#70b7ff" stroke-width="2"/><text x="380" y="211" text-anchor="middle" fill="#eaf2f8" font-size="18" font-weight="700">Метод</text><line x1="460" y1="205" x2="515" y2="205" stroke="#f2c94c" stroke-width="4"/><path d="M 503 197 L 515 205 L 503 213" fill="none" stroke="#f2c94c" stroke-width="4"/><rect x="515" y="160" width="180" height="90" rx="16" fill="#12283d" stroke="#70b7ff" stroke-width="2"/><text x="605" y="211" text-anchor="middle" fill="#eaf2f8" font-size="18" font-weight="700">Інструмент</text><line x1="695" y1="205" x2="750" y2="205" stroke="#f2c94c" stroke-width="4"/><path d="M 738 197 L 750 205 L 738 213" fill="none" stroke="#f2c94c" stroke-width="4"/><rect x="750" y="160" width="190" height="90" rx="16" fill="#12283d" stroke="#70b7ff" stroke-width="2"/><text x="845" y="211" text-anchor="middle" fill="#eaf2f8" font-size="18" font-weight="700">Перевірка</text><text x="500" y="325" text-anchor="middle" fill="#eaf2f8" font-size="18">Явний ланцюг робить вибір методу відтворюваним.</text></g></svg>