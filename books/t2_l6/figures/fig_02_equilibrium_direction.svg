<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Dynamics around Рівновага</text><line x1="130" y1="230" x2="870" y2="230" stroke="#9fb3c8" stroke-width="3"/><circle cx="500" cy="230" r="12" fill="#f2c94c"/><text x="500" y="195" text-anchor="middle" fill="#f2c94c" font-size="16" font-weight="700">S* = q/k</text><g stroke="#70b7ff" stroke-width="5"><line x1="180" y1="230" x2="430" y2="230"/><line x1="820" y1="230" x2="570" y2="230"/></g><polygon points="430,230 412,220 412,240" fill="#70b7ff"/><polygon points="570,230 588,220 588,240" fill="#70b7ff"/><text x="300" y="285" text-anchor="middle" fill="#edf4fb" font-size="16">q − kS &gt; 0 → S grows</text><text x="700" y="285" text-anchor="middle" fill="#edf4fb" font-size="16">q − kS &lt; 0 → S falls</text></g></svg>