<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Межа допустимого наукового висновку</text><rect x="110" y="105" width="650" height="305" rx="24" fill="#12283d" stroke="#70b7ff" stroke-width="3"/><text x="435" y="150" text-anchor="middle" fill="#f2c94c" font-size="20" font-weight="700">ПІДТРИМУВАНИЙ ВИСНОВОК</text><text x="165" y="205" fill="#eaf2f8" font-size="17">• дані та їх якість</text><text x="165" y="245" fill="#eaf2f8" font-size="17">• форма моделі</text><text x="165" y="285" fill="#eaf2f8" font-size="17">• калібрування</text><text x="165" y="325" fill="#eaf2f8" font-size="17">• незалежна перевірка</text><text x="165" y="365" fill="#eaf2f8" font-size="17">• невизначеність і припущення</text><rect x="800" y="150" width="150" height="210" rx="20" fill="#2b1c20" stroke="#f2c94c" stroke-width="2" stroke-dasharray="8 6"/><text x="875" y="235" text-anchor="middle" fill="#f2c94c" font-size="18" font-weight="700">СПЕКУЛЯЦІЯ</text><text x="875" y="270" text-anchor="middle" fill="#9fb3c8" font-size="14">поза межами</text><text x="875" y="292" text-anchor="middle" fill="#9fb3c8" font-size="14">доказів</text></g></svg>