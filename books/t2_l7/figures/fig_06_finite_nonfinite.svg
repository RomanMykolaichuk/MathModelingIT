<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Кінцеві та нескінченні часи до порогу</text><rect x="150" y="205" width="280" height="95" rx="12" fill="#70b7ff"/><rect x="430" y="205" width="420" height="95" rx="12" fill="#f2c94c"/><text x="290" y="262" text-anchor="middle" fill="#0b1726" font-size="26" font-weight="700">Скінченне 40%</text><text x="640" y="262" text-anchor="middle" fill="#0b1726" font-size="26" font-weight="700">nonСкінченне 60%</text><text x="500" y="365" text-anchor="middle" fill="#eaf2f8" font-size="18">Умовне середнє треба подавати разом із часткою nonСкінченне.</text></g></svg>