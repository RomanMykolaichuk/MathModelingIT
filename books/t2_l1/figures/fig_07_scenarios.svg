<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430"><rect width="1080" height="430" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="540" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Сценарій analysis: змінюємо parameter — перераховуємо optimum</text><g fill="#14283e" stroke="#2a435b"><rect x="55" y="105" width="180" height="180" rx="16"/><rect x="270" y="105" width="180" height="180" rx="16"/><rect x="485" y="105" width="180" height="180" rx="16"/><rect x="700" y="105" width="180" height="180" rx="16"/></g><g text-anchor="middle"><text x="145" y="140" fill="#70b7ff" font-size="17" font-weight="700">Baseline</text><text x="145" y="190" fill="#edf4fb" font-size="15">R=100</text><text x="145" y="215" fill="#edf4fb" font-size="15">B=250</text><text x="145" y="250" fill="#f2c94c" font-size="18">F=707.5</text><text x="360" y="140" fill="#70b7ff" font-size="17" font-weight="700">бюджет low</text><text x="360" y="190" fill="#edf4fb" font-size="15">B=230</text><text x="360" y="250" fill="#f2c94c" font-size="18">F=675</text><text x="575" y="140" fill="#70b7ff" font-size="17" font-weight="700">бюджет high</text><text x="575" y="190" fill="#edf4fb" font-size="15">B=270</text><text x="575" y="250" fill="#f2c94c" font-size="18">F=735</text><text x="790" y="140" fill="#70b7ff" font-size="17" font-weight="700">Plateau</text><text x="790" y="190" fill="#edf4fb" font-size="15">B≥295</text><text x="790" y="250" fill="#7ee0a3" font-size="18">F=765</text></g><text x="540" y="360" text-anchor="middle" fill="#9fb3c8" font-size="15">Чутливість досліджує не одну цифру, а зміну structure optimum між Сценарії.</text></g></svg>