<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360"><rect width="1080" height="360" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="540" y="42" text-anchor="middle" fill="#f2c94c" font-size="24" font-weight="700">Структура оптимізаційної задачі</text><rect x="55" y="115" width="250" height="160" rx="18" fill="#14283e" stroke="#2a435b"/><rect x="415" y="115" width="250" height="160" rx="18" fill="#14283e" stroke="#2a435b"/><rect x="775" y="115" width="250" height="160" rx="18" fill="#14283e" stroke="#2a435b"/><text x="180" y="155" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Decision variables</text><text x="180" y="208" text-anchor="middle" fill="#edf4fb" font-size="28">xA, xB, xC, xD</text><text x="540" y="155" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Objective</text><text x="540" y="205" text-anchor="middle" fill="#edf4fb" font-size="21">F(x) → max</text><text x="900" y="155" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Constraints</text><text x="900" y="198" text-anchor="middle" fill="#edf4fb" font-size="16">resource · budget</text><text x="900" y="226" text-anchor="middle" fill="#edf4fb" font-size="16">lower / upper bounds</text><path d="M305 195h105M665 195h105" stroke="#f2c94c" stroke-width="4"/><text x="540" y="325" text-anchor="middle" fill="#9fb3c8" font-size="16">Оптимум має сенс лише в межах явно записаного objective та constraints.</text></g></svg>