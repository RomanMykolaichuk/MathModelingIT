<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450"><rect width="1000" height="450" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Independent verification: multi-start + grid</text><rect x="80" y="110" width="350" height="220" rx="18" fill="#14283e" stroke="#2a435b"/><rect x="570" y="110" width="350" height="220" rx="18" fill="#14283e" stroke="#2a435b"/><text x="255" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Multi-start</text><text x="745" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Grid search</text><text x="255" y="210" text-anchor="middle" fill="#edf4fb" font-size="16">best ≈ (0.956, 0)</text><text x="255" y="245" text-anchor="middle" fill="#f2c94c" font-size="20">G &gt; 1.11</text><text x="745" y="210" text-anchor="middle" fill="#edf4fb" font-size="16">step = 0.05</text><text x="745" y="245" text-anchor="middle" fill="#f2c94c" font-size="20">|ΔG| &lt; 0.01</text><text x="500" y="390" text-anchor="middle" fill="#9fb3c8" font-size="15">Different computational mechanisms agreeing on the same region provide stronger evidence.</text></g></svg>