<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500"><rect width="1000" height="500" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Multi-start: різні старти — різні локальні рішення</text><circle cx="500" cy="235" r="28" fill="#f2c94c"/><text x="500" y="242" text-anchor="middle" fill="#07101b" font-size="14" font-weight="700">best</text><g fill="#70b7ff"><circle cx="150" cy="120" r="10"/><circle cx="160" cy="370" r="10"/><circle cx="330" cy="400" r="10"/><circle cx="760" cy="120" r="10"/><circle cx="820" cy="340" r="10"/><circle cx="650" cy="420" r="10"/></g><g stroke="#9fb3c8" stroke-width="2" stroke-dasharray="7 6"><line x1="150" y1="120" x2="470" y2="225"/><line x1="160" y1="370" x2="300" y2="310"/><line x1="330" y1="400" x2="470" y2="255"/><line x1="760" y1="120" x2="660" y2="180"/><line x1="820" y1="340" x2="690" y2="320"/><line x1="650" y1="420" x2="530" y2="270"/></g><text x="500" y="465" text-anchor="middle" fill="#9fb3c8" font-size="14">Multi-start samples several basins; agreement strengthens evidence but does not prove globality.</text></g></svg>