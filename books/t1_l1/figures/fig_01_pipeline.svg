<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="t d"><title id="t">Шлях математичного моделювання</title><desc id="d">Від проблеми через формалізацію та експеримент до висновку.</desc><rect width="1120" height="300" rx="28" fill="#0b1726"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="560" y="42" fill="#f2c94c" font-size="22" font-weight="700">Від ситуації до перевіреного висновку</text><g font-size="15" font-weight="700"><rect x="32" y="108" width="112" height="64" rx="14" fill="#17324b" stroke="#70b7ff"/><text x="88" y="146" fill="#edf4fb">Проблема</text><rect x="168" y="108" width="112" height="64" rx="14" fill="#17324b" stroke="#70b7ff"/><text x="224" y="146" fill="#edf4fb">Змінні</text><rect x="304" y="108" width="112" height="64" rx="14" fill="#17324b" stroke="#70b7ff"/><text x="360" y="146" fill="#edf4fb">Припущення</text><rect x="440" y="108" width="112" height="64" rx="14" fill="#17324b" stroke="#70b7ff"/><text x="496" y="146" fill="#edf4fb">Формула</text><rect x="576" y="108" width="112" height="64" rx="14" fill="#17324b" stroke="#70b7ff"/><text x="632" y="146" fill="#edf4fb">Алгоритм</text><rect x="712" y="108" width="112" height="64" rx="14" fill="#17324b" stroke="#70b7ff"/><text x="768" y="146" fill="#edf4fb">Код</text><rect x="848" y="108" width="112" height="64" rx="14" fill="#17324b" stroke="#70b7ff"/><text x="904" y="146" fill="#edf4fb">Перевірка</text><rect x="984" y="108" width="104" height="64" rx="14" fill="#f2c94c"/><text x="1036" y="146" fill="#111827">Висновок</text></g><g stroke="#9fb3c8" stroke-width="2"><path d="M144 140h20"/><path d="M280 140h20"/><path d="M416 140h20"/><path d="M552 140h20"/><path d="M688 140h20"/><path d="M824 140h20"/><path d="M960 140h20"/></g><text x="560" y="228" fill="#9fb3c8" font-size="16">Кожна стрілка — місце, де дослідник може зробити помилку або виконати перевірку.</text></g></svg>