<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500"><rect width="920" height="500" rx="28" fill="#0b1726"/><g font-family="Inter,Arial,sans-serif"><text x="460" y="44" text-anchor="middle" fill="#f2c94c" font-size="22" font-weight="700">Невизначеність v переходить у невизначеність t*</text><line x1="110" y1="370" x2="820" y2="370" stroke="#9fb3c8" stroke-width="2"/><rect x="235" y="160" width="450" height="90" rx="20" fill="#17324b" stroke="#70b7ff"/><text x="460" y="196" text-anchor="middle" fill="#edf4fb" font-size="18">припускаємо 7 ≤ v ≤ 9</text><text x="460" y="226" text-anchor="middle" fill="#9fb3c8" font-size="15">S₀ = 120</text><path d="M325 270 L250 340" stroke="#70b7ff" stroke-width="3"/><path d="M595 270 L670 340" stroke="#70b7ff" stroke-width="3"/><circle cx="250" cy="370" r="10" fill="#70b7ff"/><circle cx="460" cy="370" r="10" fill="#f2c94c"/><circle cx="670" cy="370" r="10" fill="#70b7ff"/><text x="250" y="405" text-anchor="middle" fill="#edf4fb" font-size="15">13.33</text><text x="460" y="405" text-anchor="middle" fill="#f2c94c" font-size="15" font-weight="700">15</text><text x="670" y="405" text-anchor="middle" fill="#edf4fb" font-size="15">17.14</text><text x="250" y="430" text-anchor="middle" fill="#9fb3c8" font-size="13">v=9</text><text x="460" y="430" text-anchor="middle" fill="#9fb3c8" font-size="13">v=8</text><text x="670" y="430" text-anchor="middle" fill="#9fb3c8" font-size="13">v=7</text><text x="460" y="470" text-anchor="middle" fill="#9fb3c8" font-size="15">Точне центральне число не повинно приховувати обґрунтований діапазон результату.</text></g></svg>