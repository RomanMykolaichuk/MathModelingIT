<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" rx="28" fill="#0b1726"/><g font-family="Inter,Arial,sans-serif"><text x="450" y="42" text-anchor="middle" fill="#f2c94c" font-size="22" font-weight="700">базовий сценарій і змінений сценарій</text><line x1="90" y1="440" x2="840" y2="440" stroke="#9fb3c8" stroke-width="2"/><line x1="90" y1="80" x2="90" y2="440" stroke="#9fb3c8" stroke-width="2"/><g fill="#9fb3c8" font-size="13"><text x="76" y="445" text-anchor="end">0</text><text x="76" y="325" text-anchor="end">40</text><text x="76" y="205" text-anchor="end">80</text><text x="76" y="85" text-anchor="end">120</text><text x="90" y="465" text-anchor="middle">0</text><text x="340" y="465" text-anchor="middle">8</text><text x="590" y="465" text-anchor="middle">16</text><text x="840" y="465" text-anchor="middle">24</text></g><text x="450" y="500" text-anchor="middle" fill="#9fb3c8" font-size="14">час t</text><text x="22" y="265" transform="rotate(-90 22 265)" text-anchor="middle" fill="#9fb3c8" font-size="14">залишок S(t)</text><path d="M90 80 L558.75 440" fill="none" stroke="#70b7ff" stroke-width="5"/><path d="M90 80 L840 440" fill="none" stroke="#f2c94c" stroke-width="5"/><circle cx="558.75" cy="440" r="6" fill="#70b7ff"/><circle cx="840" cy="440" r="6" fill="#f2c94c"/><text x="470" y="270" fill="#70b7ff" font-size="15" font-weight="700">v = 8 → t* = 15</text><text x="650" y="225" fill="#f2c94c" font-size="15" font-weight="700">v = 5 → t* = 24</text></g></svg>