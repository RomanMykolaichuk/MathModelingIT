<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500"><rect width="980" height="500" rx="28" fill="#0b1726"/><g font-family="Inter,Arial,sans-serif"><text x="490" y="45" text-anchor="middle" fill="#f2c94c" font-size="22" font-weight="700">Два представлення однієї динаміки</text><rect x="55" y="105" width="380" height="290" rx="20" fill="#14283e" stroke="#2a435b"/><text x="245" y="145" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Дискретна форма</text><text x="245" y="205" text-anchor="middle" fill="#edf4fb" font-size="28">Sₖ₊₁ = Sₖ − vΔt</text><g fill="#edf4fb" font-size="15"><text x="105" y="258">120 → 112 → 104 → 96 → ...</text><text x="105" y="300">стан оновлюється крок за кроком</text><text x="105" y="330">природно для даних по годинах/циклах</text></g><rect x="545" y="105" width="380" height="290" rx="20" fill="#14283e" stroke="#2a435b"/><text x="735" y="145" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Неперервна форма</text><text x="735" y="205" text-anchor="middle" fill="#edf4fb" font-size="30">S(t) = S₀ − vt</text><path d="M610 330 L855 220" stroke="#f2c94c" stroke-width="5"/><line x1="610" y1="350" x2="865" y2="350" stroke="#9fb3c8"/><line x1="610" y1="190" x2="610" y2="350" stroke="#9fb3c8"/><text x="735" y="382" text-anchor="middle" fill="#9fb3c8" font-size="14">компактний опис у довільний момент t</text><text x="490" y="455" text-anchor="middle" fill="#9fb3c8" font-size="16">Вибір форми визначається механізмом процесу й структурою даних, а не «престижністю» математики.</text></g></svg>