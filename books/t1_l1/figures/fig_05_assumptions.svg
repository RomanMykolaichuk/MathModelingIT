<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520"><rect width="980" height="520" rx="28" fill="#0b1726"/><g font-family="Inter,Arial,sans-serif"><text x="490" y="46" text-anchor="middle" fill="#f2c94c" font-size="22" font-weight="700">Що приховано за короткою формулою</text><circle cx="490" cy="270" r="100" fill="#17324b" stroke="#f2c94c" stroke-width="3"/><text x="490" y="260" text-anchor="middle" fill="#edf4fb" font-size="26" font-weight="700">S(t)=S₀−vt</text><text x="490" y="292" text-anchor="middle" fill="#9fb3c8" font-size="14">структура моделі</text><g fill="#14283e" stroke="#2a435b"><rect x="70" y="110" width="230" height="72" rx="15"/><rect x="680" y="110" width="230" height="72" rx="15"/><rect x="60" y="350" width="245" height="72" rx="15"/><rect x="675" y="350" width="245" height="72" rx="15"/></g><g fill="#edf4fb" font-size="15" text-anchor="middle"><text x="185" y="140">v не змінюється</text><text x="185" y="163">з часом</text><text x="795" y="140">поповнення</text><text x="795" y="163">відсутнє</text><text x="182" y="380">S₀ і v відомі</text><text x="182" y="403">достатньо точно</text><text x="797" y="380">немає випадкових</text><text x="797" y="403">втрат і зворотного зв’язку</text></g><g stroke="#70b7ff" stroke-width="2"><line x1="300" y1="165" x2="405" y2="230"/><line x1="680" y1="165" x2="575" y2="230"/><line x1="305" y1="365" x2="408" y2="310"/><line x1="675" y1="365" x2="572" y2="310"/></g></g></svg>