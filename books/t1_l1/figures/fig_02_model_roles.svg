<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420"><rect width="960" height="420" rx="28" fill="#0b1726"/><g font-family="Inter,Arial,sans-serif"><text x="480" y="48" text-anchor="middle" fill="#f2c94c" font-size="22" font-weight="700">Хто яку роль виконує в моделі?</text><rect x="55" y="115" width="240" height="180" rx="20" fill="#14283e" stroke="#2a435b"/><text x="175" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Параметри сценарію</text><text x="175" y="200" text-anchor="middle" fill="#edf4fb" font-size="30">S₀, v</text><text x="175" y="242" text-anchor="middle" fill="#9fb3c8" font-size="15">задають конкретний режим</text><rect x="360" y="115" width="240" height="180" rx="20" fill="#14283e" stroke="#2a435b"/><text x="480" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Незалежна змінна</text><text x="480" y="200" text-anchor="middle" fill="#edf4fb" font-size="34">t</text><text x="480" y="242" text-anchor="middle" fill="#9fb3c8" font-size="15">по ній рухається експеримент</text><rect x="665" y="115" width="240" height="180" rx="20" fill="#14283e" stroke="#2a435b"/><text x="785" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Результат</text><text x="785" y="200" text-anchor="middle" fill="#edf4fb" font-size="34">S(t)</text><text x="785" y="242" text-anchor="middle" fill="#9fb3c8" font-size="15">те, що ми спостерігаємо</text><path d="M295 205h60M600 205h60" stroke="#f2c94c" stroke-width="3"/><text x="480" y="350" text-anchor="middle" fill="#9fb3c8" font-size="16">Змінюючи параметр, ми порівнюємо сценарії. Змінюючи t, спостерігаємо траєкторію.</text></g></svg>