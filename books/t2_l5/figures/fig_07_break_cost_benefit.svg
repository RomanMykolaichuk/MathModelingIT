<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430"><rect width="980" height="430" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="490" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">«Зламай модель»: Витрати помилково як Виграш</text><rect x="80" y="105" width="350" height="220" rx="18" fill="#14283e" stroke="#2a435b"/><rect x="550" y="105" width="350" height="220" rx="18" fill="#14283e" stroke="#ff8d8d"/><text x="255" y="140" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Правильно: Витрати</text><text x="725" y="140" text-anchor="middle" fill="#ff8d8d" font-size="18" font-weight="700">Помилка: Виграш</text><text x="255" y="195" text-anchor="middle" fill="#edf4fb" font-size="16">70 → normalized 1</text><text x="255" y="230" text-anchor="middle" fill="#edf4fb" font-size="16">92 → normalized 0</text><text x="725" y="195" text-anchor="middle" fill="#edf4fb" font-size="16">70 → normalized 0</text><text x="725" y="230" text-anchor="middle" fill="#edf4fb" font-size="16">92 → normalized 1</text><text x="490" y="380" text-anchor="middle" fill="#9fb3c8" font-size="15">Алгоритм може відпрацювати без помилки, але предметний сенс критерію буде інвертований.</text></g></svg>