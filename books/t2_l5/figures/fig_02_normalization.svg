<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Виграш і Витрати нормалізація</text><rect x="65" y="95" width="395" height="255" rx="18" fill="#14283e" stroke="#2a435b"/><rect x="540" y="95" width="395" height="255" rx="18" fill="#14283e" stroke="#2a435b"/><text x="262" y="132" text-anchor="middle" fill="#70b7ff" font-size="19" font-weight="700">Виграш: більше = краще</text><text x="738" y="132" text-anchor="middle" fill="#70b7ff" font-size="19" font-weight="700">Витрати: менше = краще</text><line x1="125" y1="280" x2="395" y2="280" stroke="#9fb3c8" stroke-width="3"/><line x1="600" y1="280" x2="870" y2="280" stroke="#9fb3c8" stroke-width="3"/><circle cx="160" cy="280" r="8" fill="#9fb3c8"/><circle cx="360" cy="280" r="11" fill="#f2c94c"/><circle cx="635" cy="280" r="11" fill="#f2c94c"/><circle cx="835" cy="280" r="8" fill="#9fb3c8"/><g text-anchor="middle" font-size="14"><text x="160" y="315" fill="#9fb3c8">low → 0</text><text x="360" y="315" fill="#edf4fb">high → 1</text><text x="635" y="315" fill="#edf4fb">low → 1</text><text x="835" y="315" fill="#9fb3c8">high → 0</text></g><text x="500" y="390" text-anchor="middle" fill="#9fb3c8" font-size="15">Після нормалізації в усіх критеріях 1 означає краще відносне положення.</text></g></svg>