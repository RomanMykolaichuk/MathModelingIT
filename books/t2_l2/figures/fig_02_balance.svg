<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400"><rect width="960" height="400" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="480" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Балансd transportation problem</text><rect x="90" y="110" width="300" height="180" rx="20" fill="#14283e" stroke="#2a435b"/><rect x="570" y="110" width="300" height="180" rx="20" fill="#14283e" stroke="#2a435b"/><text x="240" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Постачання</text><text x="240" y="205" text-anchor="middle" fill="#edf4fb" font-size="22">35 + 50 + 40</text><text x="240" y="245" text-anchor="middle" fill="#f2c94c" font-size="28" font-weight="700">125</text><text x="720" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Попит</text><text x="720" y="205" text-anchor="middle" fill="#edf4fb" font-size="22">30 + 25 + 35 + 35</text><text x="720" y="245" text-anchor="middle" fill="#f2c94c" font-size="28" font-weight="700">125</text><text x="480" y="210" text-anchor="middle" fill="#7ee0a3" font-size="32" font-weight="700">=</text><text x="480" y="350" text-anchor="middle" fill="#9fb3c8" font-size="15">Якщо totals різні, imБаланс має бути предметно інтерпретований, а не прихований автоматично.</text></g></svg>