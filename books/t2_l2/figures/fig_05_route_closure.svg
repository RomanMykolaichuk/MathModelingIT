<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><rect width="1000" height="440" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Закриття S2 → D3: global rerouting</text><rect x="70" y="100" width="380" height="245" rx="18" fill="#14283e" stroke="#2a435b"/><rect x="550" y="100" width="380" height="245" rx="18" fill="#14283e" stroke="#ff8d8d"/><text x="260" y="140" text-anchor="middle" fill="#70b7ff" font-size="19" font-weight="700">Baseline</text><text x="740" y="140" text-anchor="middle" fill="#ff8d8d" font-size="19" font-weight="700">S2→D3 forbidden</text><text x="260" y="205" text-anchor="middle" fill="#edf4fb" font-size="18">S2→D3 = 30</text><text x="260" y="245" text-anchor="middle" fill="#f2c94c" font-size="28" font-weight="700">Z = 515</text><text x="740" y="205" text-anchor="middle" fill="#edf4fb" font-size="18">S2→D3 = 0</text><text x="740" y="245" text-anchor="middle" fill="#f2c94c" font-size="28" font-weight="700">Z = 570</text><text x="740" y="290" text-anchor="middle" fill="#9fb3c8" font-size="14">+55 ≈ +10.7%</text><text x="500" y="395" text-anchor="middle" fill="#9fb3c8" font-size="15">Закриття одного route змінює кілька flows, бо всі balances пов’язані.</text></g></svg>