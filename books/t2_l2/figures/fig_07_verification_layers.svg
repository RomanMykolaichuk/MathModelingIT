<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450"><rect width="1000" height="450" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Три рівні доказовості</text><rect x="90" y="110" width="240" height="210" rx="20" fill="#14283e" stroke="#2a435b"/><rect x="380" y="110" width="240" height="210" rx="20" fill="#14283e" stroke="#2a435b"/><rect x="670" y="110" width="240" height="210" rx="20" fill="#14283e" stroke="#2a435b"/><text x="210" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Solver</text><text x="500" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Feasibility</text><text x="790" y="150" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">Adequacy</text><text x="210" y="205" text-anchor="middle" fill="#edf4fb" font-size="15">PuLP / HiGHS</text><text x="210" y="235" text-anchor="middle" fill="#edf4fb" font-size="15">status = optimal</text><text x="500" y="205" text-anchor="middle" fill="#edf4fb" font-size="15">балансові умови</text><text x="500" y="235" text-anchor="middle" fill="#edf4fb" font-size="15">non-negativity</text><text x="790" y="205" text-anchor="middle" fill="#edf4fb" font-size="15">data + assumptions</text><text x="790" y="235" text-anchor="middle" fill="#edf4fb" font-size="15">real-world meaning</text><text x="500" y="385" text-anchor="middle" fill="#9fb3c8" font-size="15">Збіг двох solvers підсилює computation evidence, але не замінює validation Модель assumptions.</text></g></svg>