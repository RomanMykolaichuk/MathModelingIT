<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420"><rect width="1000" height="420" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Model code ≠ experiment config</text><rect x="90" y="105" width="350" height="220" rx="18" fill="#14283e" stroke="#2a435b"/><rect x="560" y="105" width="350" height="220" rx="18" fill="#14283e" stroke="#2a435b"/><text x="265" y="145" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">model.py</text><text x="735" y="145" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">experiment_config.json</text><g fill="#edf4fb" font-size="15"><text x="125" y="195">Y = max(0, b + αR − βL)</text><text x="125" y="230">simulate_observation()</text><text x="125" y="265">mathematical rules</text><text x="600" y="195">seed = 2026</text><text x="600" y="230">replications = 200</text><text x="600" y="265">noise_sd = 4</text></g><text x="500" y="380" text-anchor="middle" fill="#9fb3c8" font-size="15">Changing config changes a run; changing the mathematical relation changes the model itself.</text></g></svg>