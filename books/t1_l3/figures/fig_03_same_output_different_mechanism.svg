<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="28" fill="#0b1726"/><g font-family="Arial,sans-serif"><text x="500" y="42" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">Same output, different mechanism</text><rect x="80" y="100" width="360" height="240" rx="18" fill="#14283e" stroke="#2a435b"/><rect x="560" y="100" width="360" height="240" rx="18" fill="#14283e" stroke="#2a435b"/><text x="260" y="140" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">resource_high</text><text x="740" y="140" text-anchor="middle" fill="#70b7ff" font-size="18" font-weight="700">load_low</text><text x="260" y="195" text-anchor="middle" fill="#edf4fb" font-size="17">R=50 · L=50</text><text x="740" y="195" text-anchor="middle" fill="#edf4fb" font-size="17">R=40 · L=35</text><text x="260" y="260" text-anchor="middle" fill="#f2c94c" font-size="30" font-weight="700">Y=50</text><text x="740" y="260" text-anchor="middle" fill="#f2c94c" font-size="30" font-weight="700">Y=50</text><text x="500" y="390" text-anchor="middle" fill="#9fb3c8" font-size="15">The number alone cannot reconstruct the mechanism; scenario identity must travel with the result.</text></g></svg>